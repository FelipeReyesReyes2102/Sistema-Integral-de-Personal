# SIP-O · Sistema Integral de Personal  ->  127.0.0.1:8085 (contenedor sip-o-web-1)
server {
    listen 80;
    server_name sip-o.otek.internal;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name sip-o.otek.internal;
    ssl_certificate /etc/nginx/ssl/sip-o/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/sip-o/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;   # fotos y firmas
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
