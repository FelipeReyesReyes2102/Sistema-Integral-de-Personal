# Nginx dentro del contenedor "web": sirve el frontend compilado y reenvía /api al contenedor "api".
# El HTTPS lo termina el Nginx del servidor, que reenvía aquí por 127.0.0.1.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Fotos y firmas viajan en base64 dentro del JSON
    client_max_body_size 5m;

    # Cabeceras de seguridad: se repiten en cada location porque un add_header dentro de una
    # location anula los heredados del bloque server.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Conserva el esquema original (https) que envía el Nginx del servidor
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Manuales de usuario (HTML estático, imágenes y presentaciones): sin respaldo a la SPA
    location = /manuales {
        absolute_redirect off;  # Location relativa: el puerto interno 8080 no es visible desde fuera
        return 301 /manuales/;
    }
    location /manuales/ {
        # Solo con sesión y solo los manuales de la persona (la API decide; ver backend/app/routers/manuales.py)
        auth_request /_acceso_manuales;
        error_page 401 = @manuales_iniciar_sesion;
        error_page 403 = @manuales_sin_acceso;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }

    location = /_acceso_manuales {
        internal;
        proxy_pass http://api:8000/api/manuales/acceso;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location @manuales_iniciar_sesion {
        absolute_redirect off;
        return 302 /?manuales=1;
    }
    location @manuales_sin_acceso {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 403 '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manual no disponible</title><body style="font-family:system-ui,sans-serif;background:#f4f6fa;color:#1b2333;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px"><div style="background:#fff;border-radius:12px;padding:28px;max-width:440px;box-shadow:0 6px 22px rgba(15,30,60,.12)"><h1 style="font-size:20px;margin:0 0 8px">Este manual no corresponde a tu tipo de usuario</h1><p>Consulta los manuales que tienes disponibles.</p><p><a href="/manuales/">Ver mis manuales</a> &middot; <a href="/">Volver a SIP-O</a></p></div></body></html>';
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
